# Render Blueprint for the Spring Boot API (Vercel hosts the frontend; Supabase hosts the database).
# In Render: New → Blueprint → select this repository. Secrets marked sync:false are entered in the dashboard.
services:
  - type: web
    name: physio-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST            # Supabase → Connect → Session pooler host, e.g. aws-0-eu-central-1.pooler.supabase.com
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER            # e.g. postgres.<project-ref>
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET         # openssl rand -base64 48
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS   # your Vercel URL(s), comma-separated
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
