server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: physio-assistant-backend
  # Local secrets/config live in backend/.env (copy from .env.example). Real environment
  # variables always win over values in that file.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:physio_assistant}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:physio_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # No default on purpose: the server refuses to start without a secret of >= 32 bytes.
    secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:14}
  cors:
    # Comma-separated origin patterns. capacitor://localhost and http://localhost are the
    # origins a Capacitor-wrapped mobile build uses on iOS / Android (Capacitor 6+ Android
    # defaults to https://localhost).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,capacitor://localhost,http://localhost,https://localhost}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:5001}
  device:
    offline-timeout-seconds: 30   # heartbeat gap after which a device is considered OFFLINE
  sessions:
    stale-after-hours: ${SESSION_STALE_AFTER_HOURS:6}   # IN_PROGRESS sessions older than this are marked ABORTED
  seed:
    demo-data: ${SEED_DEMO_DATA:false}
    demo-password: ${DEMO_USER_PASSWORD:}

logging:
  level:
    com.physio.assistant: INFO

---
# Zero-install local database: run with SPRING_PROFILES_ACTIVE=h2 (file-based, survives restarts).
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:${H2_DB_PATH:./data/physio};MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none   # H2 stores MySQL ENUM/JSON columns as VARCHAR/CLOB, so strict validation is MySQL-only

---
# Production: Supabase (PostgreSQL). Run with SPRING_PROFILES_ACTIVE=postgres.
# Use the Supabase "Session pooler" connection details (IPv4, port 5432); see docs/DEPLOYMENT.md.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
